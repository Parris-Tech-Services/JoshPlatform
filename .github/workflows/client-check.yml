name: Client dependency check
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/client-check.yml
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:client
